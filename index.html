<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapidin - Prototipo con Carrito Interactivo</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Selector de vistas superior -->
    <div class="mode-selector">
        <button id="btn-cliente" class="mode-btn active" onclick="cambiarModo('cliente')">Vista Alumno</button>
        <button id="btn-buffet" class="mode-btn" onclick="cambiarModo('buffet')">
            Vista Buffet
            <span id="notif-badge" class="notification-badge" style="display: none;">1</span>
        </button>
    </div>

    <div class="phone-frame">
        <div class="phone-header-notch"></div>

        <!-- CONTENIDO DINÁMICO -->
        <div id="app-screen" class="screen-content"></div>

        <!-- MODAL COMPROBANTE -->
        <div id="modal-comprobante" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div style="background: var(--fondo-app); width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px auto;">
                    <i class="fa-solid fa-qrcode" style="font-size: 32px; color: var(--azul-rapidin);"></i>
                </div>
                <h3 style="font-family:'Rhodesia'; color:var(--azul-rapidin); font-size:24px;">Comprobante Digital</h3>
                <p style="font-size:13px; color:var(--gris-texto); margin: 6px 0 16px 0;">Orden <b>#4444</b> • Comida Take Away</p>
                <div style="background:var(--fondo-app); padding:12px; border-radius:14px; font-size:12px; margin-bottom: 20px; color: var(--azul-rapidin); font-weight: 500;">Presentá este código QR en la ventanilla rápida del buffet universitario.</div>
                <button onclick="cerrarModal()" style="background:var(--naranja-rapidin); border:none; padding:10px 24px; border-radius:14px; font-weight:700; cursor:pointer; color:var(--azul-rapidin); width: 100%;">Entendido</button>
            </div>
        </div>

        <!-- NAVEGACIÓN INFERIOR -->
        <nav class="bottom-nav" id="nav-bar"></nav>
    </div>

    <script>
        let modoActual = 'cliente';
        let ordenesNuevas = 0;
        
        // Menú completo disponible para el cliente
        let menuCliente = [
            { id: 1, nombre: "Guiso de Lentejas (Plato del día)", precio: 12000, qty: 0 },
            { id: 2, nombre: "Sánguche de Milanesa", precio: 10000, qty: 0 },
            { id: 3, nombre: "Fideos con salsa", precio: 8500, qty: 0 },
            { id: 4, nombre: "Café con Medialunas", precio: 4500, qty: 0 },
            { id: 5, nombre: "Agua Saborizada 500ml", stock: 30, precio: 2000, qty: 0 }
        ];

        let stockBuffet = [
            { nombre: "Guiso de Lentejas", stock: 15 },
            { nombre: "Sánguche de Milanesa", stock: 24 },
            { nombre: "Café con Medialunas", stock: 40 },
            { nombre: "Agua Saborizada 500ml", stock: 30 }
        ];

        let pedidosBuffet = [
            { id: 4444, detalle: "1x Guiso de Lentejas", total: 12000, estado: "En preparación" }
        ];

        function cambiarModo(modo) {
            modoActual = modo;
            document.getElementById('btn-cliente').classList.toggle('active', modo === 'cliente');
            document.getElementById('btn-buffet').classList.toggle('active', modo === 'buffet');
            
            if(modo === 'cliente') {
                mostrarCliente(1);
            } else {
                ordenesNuevas = 0;
                document.getElementById('notif-badge').style.display = 'none';
                mostrarBuffet('pedidos');
            }
        }

        function agregarAlCarrito(index) {
            menuCliente[index].qty++;
            mostrarCliente(1); // Actualiza la vista principal para que se note el carrito
        }

        function quitarDelCarrito(index) {
            if(menuCliente[index].qty > 0) {
                menuCliente[index].qty--;
                mostrarCliente(1);
            }
        }

        function totalCarrito() {
            return menuCliente.reduce((acc, item) => acc + (item.precio * item.qty), 0);
        }

        function cantCarrito() {
            return menuCliente.reduce((acc, item) => acc + item.qty, 0);
        }

        // --- VISTA CLIENTE ---
        function mostrarCliente(id) {
            const container = document.getElementById('app-screen');
            const nav = document.getElementById('nav-bar');
            
            nav.innerHTML = `
                <button class="nav-icon ${id===1?'active':''}" onclick="mostrarCliente(1)"><i class="fa-solid fa-house"></i></button>
                <button class="nav-icon ${id===2?'active':''}" onclick="mostrarCliente(2)"><i class="fa-solid fa-ticket"></i></button>
                <button class="nav-icon ${id===3?'active':''}" onclick="mostrarCliente(3)"><i class="fa-solid fa-wallet"></i></button>
            `;

            if(id === 1) {
                container.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
                        <span style="font-weight: 800; font-size: 20px; font-family: 'Rhodesia'; color: var(--azul-rapidin);">Rapidin</span>
                        <span style="font-size: 11px; background: #e5e7eb; padding: 4px 10px; border-radius: 20px; font-weight: 600;">UNM Moreno</span>
                    </div>

                    <!-- Plato del Día con botón directo para sumar -->
                    <div class="plato-banner">
                        <div>
                            <span style="font-size: 10px; text-transform: uppercase; color: var(--naranja-rapidin); font-weight:800;">Plato del día</span>
                            <h2>PLATO<br>DEL DÍA</h2>
                            <p style="font-size:12px; opacity:0.9; margin-top: 4px;">guiso de lentejas • $12.000</p>
                        </div>
                        <button onclick="agregarAlCarrito(0)" style="background:var(--naranja-rapidin); border:none; padding:8px 14px; border-radius:12px; font-weight:700; cursor:pointer; color:var(--azul-rapidin); font-size:12px;">+ Sumar</button>
                    </div>

                    <div style="font-weight: 700; font-size:14px; color: var(--azul-rapidin); margin-top:2px;">Menú Rápido:</div>
                    
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        ${menuCliente.slice(1).map((item, idx) => `
                            <div style="background: #fff; padding: 10px 14px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03);">
                                <div>
                                    <div style="font-size: 13px; font-weight: 700; color: var(--azul-rapidin);">${item.nombre}</div>                                     <div style="font-size: 11px; color: var(--gris-texto);">$${item.precio.toLocaleString()}</div>
                                </div>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 13px; font-weight: 700;">${item.qty}</span>
                                    <button onclick="agregarAlCarrito(${idx + 1})" style="background: var(--naranja-rapidin); border: none; width: 24px; height: 24px; border-radius: 6px; font-weight: bold; cursor: pointer; color: var(--azul-rapidin);">+</button>
                                    <button onclick="quitarDelCarrito(${idx + 1})" style="background: #e5e7eb; border: none; width: 24px; height: 24px; border-radius: 6px; font-weight: bold; cursor: pointer;">-</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    ${cantCarrito() > 0 ? `
                        <div onclick="mostrarCliente(3)" style="background: var(--azul-rapidin); color: #fff; padding: 12px 18px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 700; font-size: 13px; margin-top: auto;">
                            <span>Ver Pedido (${cantCarrito()} ítems)</span>                             <span>$${totalCarrito().toLocaleString()} ➔</span>
                        </div>
                    ` : ''}
                `;
            } else if(id === 2) {
                container.innerHTML = `
                    <div style="font-weight: 700; color: var(--azul-rapidin); margin-top: 5px; display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size: 15px;">Tu Ticket Activo</span>
                        <button onclick="abrirModal()" style="background:var(--azul-rapidin); color:#fff; border:none; padding:6px 12px; border-radius:10px; font-size:11px; font-weight:600; cursor:pointer;"><i class="fa-solid fa-qrcode"></i> Ver QR</button>
                    </div>
                    <div class="ticket-box">
                        ${menuCliente.filter(i => i.qty > 0).map(i => `
                            <div style="font-size:13px; font-weight:600; display:flex; justify-content:space-between; margin-bottom:4px;">
                                <span>${i.qty}x ${i.nombre}</span>                                 <span>$${(i.precio * i.qty).toLocaleString()}</span>
                            </div>
                        `).join('') || '<p style="font-size:12px; color:#666;">No hay productos en el ticket actual.</p>'}
                        <p style="font-size:12px; color:var(--gris-texto); margin-top:10px;">Estado: <span style="color:#b45309; font-weight:700;">En preparación en cocina</span></p>
                    </div>
                    <div class="badge-codigo">CODIGO DE RETIRO RÁPIDO</div>
                    <div class="codigo-grande">4444</div>
                `;
            } else if(id === 3) {
                container.innerHTML = `
                    <div style="font-weight: 700; color: var(--azul-rapidin); margin-top: 5px; font-size: 15px;">Resumen y Pago:</div>
                    <div style="background: #fff; padding: 12px; border-radius: 14px; font-size: 13px; margin-bottom: 5px;">
                        <b>Total a abonar: $${totalCarrito().toLocaleString()}</b>
                    </div>
                    <div class="pay-option" onclick="confirmarCompra()">
                        <div style="width: 35px; height: 35px; background: rgba(253,151,2,0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                            <i class="fa-solid fa-mobile-screen-button" style="font-size:16px; color:var(--naranja-rapidin);"></i>
                        </div>
                        <div style="font-size: 13px;">Mercado Pago (QR)</div>
                    </div>
                    <div class="pay-option" onclick="confirmarCompra()">
                        <div style="width: 35px; height: 35px; background: rgba(253,151,2,0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                            <i class="fa-solid fa-building-columns" style="font-size:16px; color:var(--naranja-rapidin);"></i>
                        </div>
                        <div style="font-size: 13px;">Transferencia Bancaria (Alias UNM)</div>
                    </div>
                    <div class="pay-option" onclick="confirmarCompra()">
                        <div style="width: 35px; height: 35px; background: rgba(253,151,2,0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                            <i class="fa-solid fa-money-bill-wave" style="font-size:16px; color:var(--naranja-rapidin);"></i>
                        </div>
                        <div style="font-size: 13px;">Efectivo en Ventanilla Flash</div>
                    </div>
                `;
            }
        }

        function confirmarCompra() {
            if(cantCarrito() === 0) {
                alert("Por favor, sumá al menos un producto al pedido.");
                return;
            }

            ordenesNuevas++;
            const badge = document.getElementById('notif-badge');
            badge.style.display = 'flex';
            badge.innerText = ordenesNuevas;

            // Registrar en el panel del buffet
            let detalleStr = menuCliente.filter(i => i.qty > 0).map(i => `${i.qty}x ${i.nombre}`).join(', ');
            pedidosBuffet.unshift({ id: 4444, detalle: detalleStr, total: totalCarrito(), estado: "En preparación" });

            mostrarCliente(2);
        }

        function abrirModal() { document.getElementById('modal-comprobante').style.display = 'flex'; }
        function cerrarModal() { document.getElementById('modal-comprobante').style.display = 'none'; }

        // --- VISTA BUFFET ---
        function mostrarBuffet(seccion) {
            const container = document.getElementById('app-screen');
            const nav = document.getElementById('nav-bar');

            nav.innerHTML = `
                <button class="nav-icon ${seccion==='pedidos'?'active':''}" onclick="mostrarBuffet('pedidos')"><i class="fa-solid fa-list-check"></i> Órdenes</button>
                <button class="nav-icon ${seccion==='stock'?'active':''}" onclick="mostrarBuffet('stock')"><i class="fa-solid fa-boxes-stacked"></i> Stock</button>
            `;

            if(seccion === 'pedidos') {
                container.innerHTML = `
                    <div class="buffet-header">Gestión de Take Away</div>
                    ${pedidosBuffet.map((ord, idx) => `
                        <div class="order-card">
                            <div style="display:flex; justify-content:space-between; font-weight:700; font-size:15px;">
                                <span style="color:var(--azul-rapidin);">Orden #${ord.id}</span>                                 <span style="color:#d97706;">$${ord.total.toLocaleString()}</span>
                            </div>
                            <p style="font-size:13px; color:#4b5563;">${ord.detalle}</p>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                                <span style="font-size:11px; color:var(--gris-texto);">Estado: <b style="color:var(--azul-rapidin);">${ord.estado}</b></span>
                                <button class="btn-action-buffet" onclick="cambiarEstado(${idx})">Avanzar ➔</button>
                            </div>
                        </div>
                    `).join('')}
                `;
            } else {
                container.innerHTML = `
                    <div class="buffet-header">Control de Stock Diario</div>
                    ${stockBuffet.map((item, idx) => `
                        <div class="stock-control-card">
                            <div>
                                <h4 style="font-size:13px; font-weight:700; color:var(--azul-rapidin);">${item.nombre}</h4>
                                <p style="font-size:11px; color:var(--gris-texto);">Disponibles: <b>${item.stock} u.</b></p>
                            </div>
                            <div style="display:flex; gap:8px;">
                                <button onclick="modificarStock(${idx}, -1)" style="background:#f3f4f6; border:1px solid #d1d5db; width:30px; height:30px; border-radius:10px; font-weight:bold; cursor:pointer;">-</button>
                                <button onclick="modificarStock(${idx}, 1)" style="background:#f3f4f6; border:1px solid #d1d5db; width:30px; height:30px; border-radius:10px; font-weight:bold; cursor:pointer;">+</button>
                            </div>
                        </div>
                    `).join('')}
                `;
            }
        }

        function cambiarEstado(index) {
            let estados = ["Recibido", "En preparación", "Listo para retirar", "Entregado"];
            let actualIdx = estados.indexOf(pedidosBuffet[index].estado);
            if(actualIdx < estados.length - 1) {
                pedidosBuffet[index].estado = estados[actualIdx + 1];
            } else {
                pedidosBuffet[index].estado = "Entregado";
            }
            mostrarBuffet('pedidos');
        }

        function modificarStock(index, delta) {
            stockBuffet[index].stock = Math.max(0, stockBuffet[index].stock + delta);
            mostrarBuffet('stock');
        }

        cambiarModo('cliente');
    </script>
</body>
</html>
